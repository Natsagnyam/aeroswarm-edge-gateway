apiVersion: apps/v1
kind: Deployment
metadata:
  name: aeroswarm-edge-gateway
  namespace: default
  labels:
    app: aeroswarm-edge-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aeroswarm-edge-gateway
  template:
    metadata:
      labels:
        app: aeroswarm-edge-gateway
    spec:
      containers:
      - name: gateway
        image: aeroswarm-edge-gateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
      - name: tailscale
        image: tailscale/tailscale:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailscale-auth
              key: TS_AUTHKEY
        - name: TS_STATE_DIR
          value: /var/lib/tailscale
        - name: TS_USERSPACE
          value: "false"
        securityContext:
          capabilities:
            add: ["NET_ADMIN", "NET_RAW"]
        volumeMounts:
        - name: tailscale-state
          mountPath: /var/lib/tailscale
      volumes:
      - name: tailscale-state
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aeroswarm-gateway-service
  namespace: default
spec:
  selector:
    app: aeroswarm-edge-gateway
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP