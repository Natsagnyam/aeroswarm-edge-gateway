apiVersion: apps/v1
kind: Deployment
metadata:
  name: aeroswarm-edge-gateway
  namespace: default
  labels:
    app: aeroswarm-gateway
    tier: edge-iot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aeroswarm-gateway
  template:
    metadata:
      labels:
        app: aeroswarm-gateway
    spec:
      hostNetwork: true  # Required for direct host MMIO hardware access
      containers:
      - name: gateway-server
        image: aeroswarm-edge-gateway:latest
        imagePullPolicy: Never
        securityContext:
          privileged: true # Grants access to /dev/mem for GPIO register mapping
        ports:
        - containerPort: 8080
          name: http-rest
        resources:
          limits:
            cpu: "250m"
            memory: "64Mi"
          requests:
            cpu: "50m"
            memory: "16Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: aeroswarm-gateway-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: aeroswarm-gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30808
